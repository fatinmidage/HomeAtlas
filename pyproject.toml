[project]
name = "home-atlas"
version = "0.1.0"
description = "Home inventory ontology service for Hermes MCP agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15",
  "fastapi>=0.115",
  "mcp>=1.9",
  "pydantic-ai>=0.2",
  "pydantic-settings>=2.8",
  "psycopg[binary]>=3.2",
  "sqlmodel>=0.0.24",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["home_atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

